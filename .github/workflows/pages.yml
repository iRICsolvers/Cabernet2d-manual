name: Build and deploy manual to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Sphinx
        run: pip install -r requirements.txt

      - name: Build Japanese manual
        run: sphinx-build -M html source build

      - name: Build English manual
        run: sphinx-build -M html source_en build_en

      - name: Merge English manual under /en/
        run: |
          mkdir -p build/html/en
          cp -r build_en/html/. build/html/en/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
